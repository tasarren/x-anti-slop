name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `build` is a required status check on main. paths-ignore would leave
      # documentation-only pull requests pending, so this job still reports
      # success and only skips install and packaging. Tag pushes and manual
      # runs always package. A compare of 300 or more files, or a compare
      # error, packages as well.
      - name: Check whether the change is documentation only
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -u
          skip=false
          is_doc() {
            case "$1" in
              *.md|docs/*|.github/FUNDING.yml|LICENSE|LICENSE.txt) return 0 ;;
              *) return 1 ;;
            esac
          }
          event="${EVENT_NAME:-}"
          if [[ "$event" == "pull_request" ]]; then
            start="${BASE_SHA:-}"
            end="${HEAD_SHA:-}"
          elif [[ "$event" == "push" && "${REF_TYPE:-}" != "tag" ]]; then
            start="${BEFORE_SHA:-}"
            end="${GITHUB_SHA:-}"
          else
            start=""
            end=""
          fi
          if [[ "$start" =~ ^[0-9a-fA-F]{40}$ && "$end" =~ ^[0-9a-fA-F]{40}$ && "$start" != "$end" && ! "$start" =~ ^0+$ ]]; then
            if payload=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${start}...${end}"); then
              count=$(jq -r 'if (.files | type) == "array" then (.files | length) else 0 end' <<<"$payload" 2>/dev/null || true)
              if [[ "$count" =~ ^[0-9]+$ && "$count" -gt 0 && "$count" -lt 300 ]]; then
                if paths_text=$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<<"$payload" 2>/dev/null); then
                  matched=0
                  skip=true
                  while IFS= read -r file || [[ -n "$file" ]]; do
                    [[ -z "$file" ]] && continue
                    matched=1
                    if ! is_doc "$file"; then
                      skip=false
                      break
                    fi
                  done <<<"$paths_text"
                  if [[ "$matched" -eq 0 ]]; then skip=false; fi
                fi
              fi
            fi
          fi
          printf 'skip=%s\n' "$skip" >> "$GITHUB_OUTPUT"
          if [[ "$skip" == true ]]; then
            message="Every changed file is documentation, so install and packaging were skipped."
            printf '%s\n' "$message"
            printf '%s\n' "$message" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.docs.outputs.skip != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.docs.outputs.skip != 'true'
        with:
          node-version: '24'
          cache: npm
      - if: steps.docs.outputs.skip != 'true'
        run: npm ci
      - name: Check, build, and package both browsers
        if: steps.docs.outputs.skip != 'true'
        run: npm run package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.docs.outputs.skip != 'true'
        with:
          name: x-anti-slop-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Download packages for verification
        if: steps.docs.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: x-anti-slop-${{ github.sha }}
          path: ${{ runner.temp }}/xas-artifact-check
      - name: Verify downloaded packages
        if: steps.docs.outputs.skip != 'true'
        working-directory: ${{ runner.temp }}/xas-artifact-check
        run: sha256sum --check SHA256SUMS.txt
      - name: Upload store screenshots and walkthroughs
        if: steps.docs.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: x-anti-slop-store-media-${{ github.sha }}
          path: |
            store-assets/screenshots/*.png
            store-assets/animation/*.mp4
            store-assets/animation/*.webp
            store-assets/animation/*.gif
            store-assets/animation/recording.json
            store-assets/promo-440x280.png
            store-assets/README.md
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: x-anti-slop-${{ github.sha }}
          path: artifacts
      - name: Create the tagged GitHub release
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then release_flags+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" artifacts/* "${release_flags[@]}" --verify-tag --title "X-Anti-Slop $RELEASE_TAG" --notes-file /dev/stdin <<'NOTES'
          Chromium and Firefox packages, plus reproducible source and SHA-256 checksums.

          Chromium users can extract the Chromium ZIP and use **Load unpacked**.
          The Firefox ZIP is unsigned and can be loaded as a temporary add-on. After Mozilla approval, a separate workflow adds the signed Firefox XPI here for permanent installation through **Install Add-on From File…** in about:addons.

          See the repository README for installation instructions. Store submission is a separate manual workflow.
          NOTES
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
