name: Collect signed Firefox download

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag; leave empty for the latest stable release
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: signed-firefox-download
  cancel-in-progress: false

jobs:
  collect:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Attach the approved XPI if it is available
        run: node scripts/collect-firefox.ts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
