name: Bug report
description: Report filtering, settings, or installation problems.
body:
  - type: markdown
    attributes:
      value: Use synthetic post text and redact personal information. Report security vulnerabilities through the private security link instead.
  - type: input
    id: version
    attributes:
      label: Extension version and install source
      placeholder: 0.1.0, GitHub release / local build / store
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser version and operating system
      placeholder: Firefox 140, Linux
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the regex and flags, hide mode, and a short synthetic post when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
